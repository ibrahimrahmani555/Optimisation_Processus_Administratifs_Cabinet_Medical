services:
  - type: web
    name: cabinet-medical-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    branch: deployment
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://ibrahimrh555.github.io
