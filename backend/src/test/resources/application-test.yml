spring:
  datasource:
    url: jdbc:h2:mem:cabinet_medical;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  security:
    jwt-secret: test-secret-must-contain-at-least-32-bytes
    access-token-minutes: 5
